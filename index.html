<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="ARCADIAS — explorez les royaumes d'Asterion.">
  <title>ARCADIAS — Ardencourt</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game" aria-label="ARCADIAS — Ardencourt">
    <section id="stage" aria-label="Place d'Ardencourt">
      <canvas id="world3d" aria-label="Ville 3D d'Ardencourt"></canvas>
      <div id="player-ring" aria-hidden="true"></div>
      <div id="collision-hint" role="status">Cette direction est bloquée.</div>
      <nav id="psp-pad" aria-label="Commandes directionnelles">
        <button class="direction up" data-dir="up" aria-label="Haut">▲</button>
        <button class="direction left" data-dir="left" aria-label="Gauche">◀</button>
        <button class="direction right" data-dir="right" aria-label="Droite">▶</button>
        <button class="direction down" data-dir="down" aria-label="Bas">▼</button>
        <span class="pad-center" aria-hidden="true"></span>
      </nav>
      <button id="interact" type="button" hidden>Parler · E</button>
      <output id="move-state" aria-live="polite">Prêt</output>
      <aside id="dialogue" hidden aria-live="polite">
        <div class="dialogue-heading"><strong id="dialogue-name">Amélie</strong><button id="dialogue-close" aria-label="Fermer">×</button></div>
        <p id="dialogue-text"></p>
        <button id="dialogue-next">Continuer</button>
      </aside>
      <div id="game-toast" role="status" aria-live="polite"></div>
      <div id="game-actions" aria-label="Actions du jeu">
        <button data-panel="character">Personnage</button>
        <button data-panel="inventory">Inventaire</button>
        <button data-panel="quests">Quêtes</button>
        <button data-panel="map">Carte</button>
        <button id="save-game">Sauvegarder</button>
      </div>
      <aside id="game-panel" hidden>
        <button id="panel-close" aria-label="Fermer">×</button>
        <h2 id="panel-title"></h2>
        <div id="panel-content"></div>
      </aside>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="ARCADIAS — explorez les royaumes d'Asterion.">
  <title>ARCADIAS — Ardencourt</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game" aria-label="ARCADIAS — Ardencourt">
    <section id="stage" aria-label="Place d'Ardencourt">
      <img id="scene" src="./assets/ardencourt-reference.png" alt="Place d'Ardencourt, maquette de référence" draggable="false">
      <div id="hero" role="img" aria-label="Héros Arcadien">
        <svg viewBox="0 0 100 150" aria-hidden="true">
          <ellipse cx="50" cy="140" rx="27" ry="7" fill="#07101a" opacity=".55"/>
          <path class="cape" d="M36 54 L17 69 L9 125 L37 112 L51 77 L67 118 L88 128 L79 67 L62 51Z" fill="#8f1726" stroke="#d4a84f" stroke-width="2"/>
          <path d="M38 54 L24 83 L34 120 L47 126 L52 79 L64 124 L77 116 L74 78 L62 51Z" fill="#171d29" stroke="#c49b50" stroke-width="2"/>
          <path d="M36 57 L24 79 L36 94 L48 81 L61 95 L76 78 L63 55Z" fill="#273247" stroke="#d8b56a" stroke-width="2"/>
          <path d="M37 60 L29 84 L39 91 L48 79 L58 92 L70 83 L62 58Z" fill="#111722"/>
          <path d="M41 15 Q50 4 62 15 L68 34 L62 53 L39 52 L31 34Z" fill="#e3b995" stroke="#30222a" stroke-width="2"/>
          <path d="M31 31 Q24 10 43 6 Q61 -2 69 17 L64 29 L56 20 L49 29 L42 19 L34 34Z" fill="#17151b" stroke="#6e5144" stroke-width="2"/>
          <path d="M40 36 L46 36 M55 36 L61 36" stroke="#38232a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M45 45 Q51 48 57 44" fill="none" stroke="#8d4c4b" stroke-width="1.5"/>
          <path d="M34 58 L18 89 L27 96 L43 68 M64 59 L82 89 L73 97 L57 68" fill="#1c2534" stroke="#c59d54" stroke-width="3"/>
          <path d="M45 81 L37 119 L45 136 L53 136 L56 91 M58 83 L61 120 L72 136 L80 132 L72 89" fill="#202a39" stroke="#b48d4e" stroke-width="3"/>
          <path d="M42 134 L35 144 L55 144 L54 136 M70 135 L65 144 L88 144 L80 135" fill="#111722" stroke="#d1ae69" stroke-width="2"/>
          <path class="sword" d="M76 66 L96 119 L91 124 L69 72Z" fill="#d9e5ee" stroke="#687f96" stroke-width="2"/>
          <path d="M69 69 L84 62 L87 66 L73 75Z" fill="#c69b4e"/>
        </svg>
      </div>
      <div id="player-ring" aria-hidden="true"></div>
      <div id="collision-hint" role="status">Utilise les flèches pour te déplacer</div>
      <nav id="psp-pad" aria-label="Commandes directionnelles">
        <button class="direction up" data-dir="up" aria-label="Haut">▲</button>
        <button class="direction left" data-dir="left" aria-label="Gauche">◀</button>
        <button class="direction right" data-dir="right" aria-label="Droite">▶</button>
        <button class="direction down" data-dir="down" aria-label="Bas">▼</button>
        <span class="pad-center" aria-hidden="true"></span>
      </nav>
      <output id="move-state" aria-live="polite">Prêt</output>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
